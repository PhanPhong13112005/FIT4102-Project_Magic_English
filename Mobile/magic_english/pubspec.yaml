name: magic_english
description: "A comprehensive mobile application for learning English with AI-powered vocabulary enrichment and grammar checking."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP and API
  http: ^1.1.0
  
  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  
  # Charts
  fl_chart: ^0.65.0
  
  # Date/Time
  intl: ^0.19.0
  
  # Storage (Local)
  shared_preferences: ^2.2.2
  
  # Serialization
  json_serializable: ^6.7.1
  
  # Utilities
  bloc: ^8.1.2
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Navigation
  go_router: ^13.0.0
  
  # Loading & Dialogs
  loading_overlay: ^0.3.0
  fluttertoast: ^8.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
